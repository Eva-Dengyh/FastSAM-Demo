# 本地开发配置：./start.sh 用此文件
# 两个 backend 进程：worker-0 在 8000，worker-1 在 8002

listen: ":8080"
api_prefix: "/api"

workers:
  - id: "worker-0"
    url: "http://localhost:8000"
    max_inflight: 2
    max_queue: 32
  - id: "worker-1"
    url: "http://localhost:8002"
    max_inflight: 2
    max_queue: 32

request_timeout_seconds: 60
session_ttl_seconds: 3600

health:
  interval_seconds: 5
  timeout_seconds: 2
  unhealthy_threshold: 3
  healthy_threshold: 2

log_level: "info"

# Gateway 监听
listen: ":8080"

# 业务前缀（前端走 /api/* 进来）
api_prefix: "/api"

# 后端 worker 列表（docker-compose 形态，按容器名访问）
workers:
  - id: "worker-0"
    url: "http://backend-0:8000"
    max_inflight: 2
    max_queue: 32
  - id: "worker-1"
    url: "http://backend-1:8000"
    max_inflight: 2
    max_queue: 32

# 单个请求的最大处理超时（包含队列等待 + 上游推理）
request_timeout_seconds: 60

# 会话 TTL（image_id → worker_id）；与后端 image_cache_ttl 对齐
session_ttl_seconds: 3600

# 健康检查
health:
  interval_seconds: 5
  timeout_seconds: 2
  unhealthy_threshold: 3   # 连续失败次数
  healthy_threshold: 2     # 恢复需要的连续成功次数

# 日志级别：debug / info / warn / error
log_level: "info"

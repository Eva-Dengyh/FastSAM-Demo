services:
  backend-0:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fastsam-backend-0
    expose:
      - "8000"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models/sam2.1_hiera_tiny.pt
      - CHECKPOINT_PATH=/app/models/sam2.1_hiera_tiny.pt
      - WORKER_ID=worker-0
      - MAX_INFLIGHT=2
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fastsam-backend-1
    expose:
      - "8000"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models/sam2.1_hiera_tiny.pt
      - CHECKPOINT_PATH=/app/models/sam2.1_hiera_tiny.pt
      - WORKER_ID=worker-1
      - MAX_INFLIGHT=2
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: fastsam-gateway
    ports:
      - "8080:8080"
    depends_on:
      - backend-0
      - backend-1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fastsam-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8080
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  models:
    driver: local
